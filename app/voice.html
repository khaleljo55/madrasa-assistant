<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإملاء الصوتي — المساعد الإداري</title>
<style>
  :root { --brand:#0f6b5c; --bg:#f4f6f5; --ink:#1d2b28; --muted:#6b7c78; --rec:#c2410c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         font-family:"Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; color:var(--ink); }
  .card { width:min(560px, 92vw); background:#fff; border-radius:18px; padding:28px; box-shadow:0 10px 40px rgba(0,0,0,.08); text-align:center; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
  #mic { width:110px; height:110px; border-radius:50%; border:none; cursor:pointer; background:var(--brand); color:#fff; font-size:44px;
         box-shadow:0 6px 20px rgba(15,107,92,.35); transition:.2s; }
  #mic.on { background:var(--rec); box-shadow:0 0 0 12px rgba(194,65,12,.15), 0 0 0 24px rgba(194,65,12,.08); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 18px rgba(194,65,12,.12), 0 0 0 34px rgba(194,65,12,.05);} }
  #status { margin:16px 0; font-weight:600; min-height:1.4em; }
  #text { min-height:110px; text-align:right; background:#f7faf9; border:1px solid #dde6e3; border-radius:12px; padding:14px; font-size:18px; line-height:1.8; }
  #text .interim { color:var(--muted); }
  .row { display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
  button.b { padding:10px 20px; border-radius:10px; border:1px solid #cfdcd8; background:#fff; font:inherit; cursor:pointer; }
  button.b.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .warn { color:#b42318; background:#fef3f2; padding:12px; border-radius:10px; margin-top:14px; }
</style>
</head>
<body>
<div class="card">
  <h1>🎙️ الإملاء الصوتي</h1>
  <p class="sub">تحدّثي وسيظهر النص مباشرة في الحقل المحدد داخل التطبيق</p>
  <button id="mic" title="بدء / إيقاف">🎤</button>
  <div id="status">اضغطي على الميكروفون للبدء</div>
  <div id="text"><span id="final"></span><span class="interim" id="interim"></span></div>
  <div class="row">
    <button class="b primary" id="done">تم — العودة للتطبيق</button>
    <button class="b" id="clear">مسح</button>
  </div>
  <div id="warn"></div>
</div>
<script>
  const lang = new URLSearchParams(location.search).get('lang') || 'ar-SA';
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById('mic'), statusEl = document.getElementById('status');
  const finalEl = document.getElementById('final'), interimEl = document.getElementById('interim');
  let rec = null, on = false;

  function post(msg) {
    return fetch('/text', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(msg) }).catch(()=>{});
  }

  if (!SR) {
    mic.disabled = true;
    document.getElementById('warn').innerHTML = '<div class="warn">هذا المتصفح لا يدعم التعرّف على الصوت. افتحي هذه الصفحة في Microsoft Edge أو Google Chrome.</div>';
  } else {
    rec = new SR();
    rec.lang = lang; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) { finalEl.textContent += t + ' '; post({ text: t.trim() }); }
        else interim += t;
      }
      interimEl.textContent = interim;
    };
    rec.onerror = (e) => {
      const map = { 'not-allowed':'لم يُسمح باستخدام الميكروفون — اسمحي له من شريط العنوان', 'no-speech':'لم يُلتقط صوت، حاولي مرة أخرى', 'network':'تحقّقي من اتصال الإنترنت' };
      statusEl.textContent = map[e.error] || ('خطأ: ' + e.error);
    };
    rec.onend = () => { if (on) { try { rec.start(); } catch {} } else { mic.classList.remove('on'); } };
    mic.onclick = () => {
      if (on) { on = false; rec.stop(); mic.classList.remove('on'); statusEl.textContent = 'متوقّف'; }
      else { on = true; try { rec.start(); } catch {} mic.classList.add('on'); statusEl.textContent = 'أستمع إليكِ…'; }
    };
    // يبدأ تلقائياً
    setTimeout(() => mic.click(), 400);
  }
  document.getElementById('clear').onclick = () => { finalEl.textContent = ''; interimEl.textContent = ''; };
  document.getElementById('done').onclick = async () => {
    on = false; if (rec) rec.stop();
    await post({ done: true });
    statusEl.textContent = 'تم. يمكنكِ إغلاق هذه النافذة.';
    setTimeout(() => window.close(), 300);
  };
</script>
</body>
</html>
